<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Auror - Create Account</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Geist:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#fcf8ff",
            "background": "#fcf8ff",
            "primary": "#4648d4",
            "secondary": "#6b38d4",
            "on-background": "#1b1b23",
            "on-surface": "#1b1b23",
            "on-surface-variant": "#464554",
            "outline-variant": "#c7c4d7",
            "primary-container": "#6063ee",
            "error": "#ba1a1a"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          fontFamily: {
            "body": ["Inter", "sans-serif"],
            "display": ["Geist", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-image: radial-gradient(circle at 10% 20%, rgba(70, 72, 212, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(107, 56, 212, 0.05) 0%, transparent 40%);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body antialiased flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-outline-variant/30 rounded-2xl p-8 shadow-[0px_20px_50px_rgba(70,72,212,0.06)] relative overflow-hidden">
    <!-- Accent Top Bar Glow -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary to-secondary"></div>
    
    <div class="mb-8 text-center">
      <h1 class="font-display text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">Auror</h1>
      <p class="font-display text-sm text-on-surface-variant mt-2 font-medium tracking-wide">Join the Realm of Deep Flow</p>
    </div>

    <!-- Error Alert Box -->
    <div id="error-box" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-error text-sm flex items-center gap-3">
      <span class="material-symbols-outlined text-[20px]">error</span>
      <span id="error-message">Registration failed. Please try again.</span>
    </div>

    <!-- Success Alert Box -->
    <div id="success-box" class="hidden mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm flex items-center gap-3">
      <span class="material-symbols-outlined text-[20px]">check_circle</span>
      <span>Account created! Redirecting to login...</span>
    </div>

    <form id="register-form" class="space-y-5">
      <div>
        <label for="username" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            minlength="3"
            maxlength="30"
            class="w-full bg-slate-50 border border-outline-variant/40 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-all outline-none" 
            placeholder="johndoe"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Email Address</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            class="w-full bg-slate-50 border border-outline-variant/40 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-all outline-none" 
            placeholder="name@example.com"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            minlength="6"
            class="w-full bg-slate-50 border border-outline-variant/40 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-all outline-none" 
            placeholder="••••••••"
          />
        </div>
      </div>

      <div>
        <label for="role" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">I want to be a</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">badge</span>
          <select 
            id="role" 
            name="role" 
            class="w-full bg-slate-50 border border-outline-variant/40 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-all outline-none appearance-none"
          >
            <option value="reader">Reader (Browse & Unlock Stories)</option>
            <option value="author">Author (Publish Stories & Earn)</option>
            <option value="admin">Admin (System Manager)</option>
          </select>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-primary to-secondary text-white font-semibold text-sm shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 transition-all flex justify-center items-center gap-2 hover:scale-[1.01] active:scale-[0.99] duration-150"
      >
        <span>Create Account</span>
        <span class="material-symbols-outlined text-[18px]">person_add</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-outline-variant/20 text-center">
      <p class="text-xs text-on-surface-variant font-medium">
        Already have an account? <a href="/login" class="text-primary hover:underline font-semibold ml-1">Sign In</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      
      const errorBox = document.getElementById('error-box');
      const errorMessage = document.getElementById('error-message');
      const successBox = document.getElementById('success-box');
      
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password, role })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }
        
        successBox.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 1200);
        
      } catch (err) {
        errorMessage.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
