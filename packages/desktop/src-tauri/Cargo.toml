[package]
name = "readr-author"
version = "0.0.0"
description = "readr Author desktop app"
authors = ["readr team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "readr_author_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
