name: CI — Frontend

# Matrix over the three per-role frontend packages shipped in Phases B–D.
# The apex flows through packages/reader; packages/author and
# packages/admin run on author.auror.my and admin.auror.my respectively.

on:
  push:
    branches: [dev, main]
    paths:
      - 'packages/reader/**'
      - 'packages/author/**'
      - 'packages/admin/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'packages/reader/**'
      - 'packages/author/**'
      - 'packages/admin/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-frontend.yml'

jobs:
  reader:
    name: reader — typecheck / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auror/reader typecheck
      - run: pnpm --filter @auror/reader build
      - run: pnpm --filter @auror/reader test:e2e

  author:
    name: author — typecheck / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auror/author typecheck
      - run: pnpm --filter @auror/author build
      - run: pnpm --filter @auror/author test:e2e

  admin:
    name: admin — typecheck / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auror/admin typecheck
      - run: pnpm --filter @auror/admin build
      - run: pnpm --filter @auror/admin test:e2e