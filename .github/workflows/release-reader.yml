name: Release — Reader image

# Phase A: workflow_dispatch only. Phase B.3 adds a `push` trigger gated on
# `packages/reader/**` + `packages/shared/**` once `packages/reader` exists
# and is live on `auror.my`.
#
# Build context is `packages/reader` once that package is scaffolded; for now
# it builds `packages/webapp` (the legacy monolith) so the pipeline can be
# smoke-tested before Phase B cuts over. See dev-frontend-split.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/auror-reader
  # Phase B.3: switch SOURCE_CONTEXT to packages/reader.
  SOURCE_CONTEXT: packages/webapp
  DOCKERFILE: packages/webapp/Dockerfile
  # Phase B.3: switch IMAGE_NAME to auror-reader and drop the legacy suffix.
  IMAGE_NAME_LEGACY: ${{ github.repository_owner }}/auror-webapp

jobs:
  build-and-push:
    name: Build + push ghcr image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Publish under both the legacy and new image names until Phase E
          # removes the webapp package. The legacy name keeps the existing
          # Coolify deploy working during the cutover.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LEGACY }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=reader
          cache-to: type=gha,scope=reader,mode=max