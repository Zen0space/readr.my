name: Release — Reader image

# Phase B.3: push trigger is live, gated on the reader package + shared. The
# legacy webapp workflow stays in place during the cutover (release-webapp was
# renamed to this file in A.3; it dual-publishes under auror-reader + the
# legacy auror-webapp name until Phase E removes the webapp package).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/reader/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/release-reader.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/auror-reader
  IMAGE_NAME_LEGACY: ${{ github.repository_owner }}/auror-webapp
  SOURCE_CONTEXT: packages/reader
  DOCKERFILE: packages/reader/Dockerfile

jobs:
  build-and-push:
    name: Build + push ghcr image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LEGACY }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=reader
          cache-to: type=gha,scope=reader,mode=max