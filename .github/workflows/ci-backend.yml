name: CI — Backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @readr/backend typecheck

      - name: Lint
        run: pnpm --filter @readr/backend lint

      - name: Test
        run: pnpm --filter @readr/backend test

      - name: Build
        run: pnpm --filter @readr/backend build
