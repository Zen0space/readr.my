name: Release — Author image

# Phase A: workflow_dispatch only. Phase C.3 adds a `push` trigger gated on
# `packages/author/**` + `packages/shared/**` once `packages/author` exists
# and is live on `author.auror.my`.
#
# Until that lands this workflow builds the webapp monolith under the
# `auror-author` image name so the Coolify entry for the author subdomain
# can be smoke-tested. The pipeline is a clone of `release-reader.yml`
# (see dev-frontend-split.md §A.3.c).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/auror-author
  SOURCE_CONTEXT: packages/webapp
  DOCKERFILE: packages/webapp/Dockerfile

jobs:
  build-and-push:
    name: Build + push ghcr image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=author
          cache-to: type=gha,scope=author,mode=max