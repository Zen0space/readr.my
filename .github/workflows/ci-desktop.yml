name: CI — Desktop

on:
  push:
    branches: [dev, main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-desktop.yml'

jobs:
  desktop:
    name: Typecheck / Lint / Test / Build / Cargo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @auror/desktop typecheck

      - name: Lint
        run: pnpm --filter @auror/desktop lint

      - name: Test
        run: pnpm --filter @auror/desktop test

      - name: Build (Vite)
        run: pnpm --filter @auror/desktop build

      - name: Cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --locked

      - name: Cargo clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
