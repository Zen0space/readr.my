# Local development stack for Auror.
#
# Default (`docker compose up -d`) brings up ONLY redis. The backend, webapp,
# and caddy are opt-in via profiles — run those processes on the host instead
# (`pnpm --filter @auror/backend dev`), pointing at this redis on :6379.
#
# Env: there is no root .env. Each service reads its package-local .env
# (packages/<name>/.env). For the containerized services, the few values that
# must differ inside Docker (container networking) are overridden under
# `environment:` — package .env files use host addresses (127.0.0.1).
#
# What this DOES NOT bring up:
#   - Supabase. Run `supabase start` (Supabase CLI) in another terminal; it
#     manages its own Docker stack on the ports defined in supabase/config.toml.
#     Containerized backend resolves it via http://host.docker.internal:54321.
#   - GlitchTip, Uptime Kuma, postgres-exporter — deferred (see dev-phase0 B0.1).
#
# Coolify users: don't use this file in production. Coolify pulls the prebuilt
# ghcr.io/<owner>/auror-backend and ghcr.io/<owner>/auror-webapp images via
# the release workflows in .github/workflows/release-*.yml.
#
# Profiles:
#   - (default)          redis only
#   - --profile backend  adds the Fastify API (containerized)
#   - --profile webapp   adds the Next.js webapp + backend (requires source)
#   - --profile proxy    adds the Caddy reverse proxy at :80 + backend

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    profiles: ["backend", "webapp", "proxy"]
    depends_on:
      redis:
        condition: service_healthy
    # Source of truth: packages/backend/.env (host addresses).
    env_file:
      - packages/backend/.env
    # Container-only overrides: package .env points at 127.0.0.1, which inside a
    # container means the container itself. Redirect to the compose network and
    # the host gateway. Everything else (Supabase keys, payments, CORS) comes
    # from the env_file above.
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"

  webapp:
    build:
      context: .
      dockerfile: packages/webapp/Dockerfile
    restart: unless-stopped
    # Source of truth: packages/webapp/.env (created once webapp is scaffolded).
    # required: false so the stack still boots before that file exists.
    env_file:
      - path: packages/webapp/.env
        required: false
    # Container-only overrides: reach the backend over the compose network.
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["webapp"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    profiles: ["proxy"]

volumes:
  redis-data:
  caddy-data:
  caddy-config:
