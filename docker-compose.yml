services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "0.0.0.0"
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_BASE_URL: ${PAYMENT_WEBHOOK_BASE_URL}
      BILLPLZ_API_KEY: ${BILLPLZ_API_KEY:-}
      BILLPLZ_COLLECTION_ID: ${BILLPLZ_COLLECTION_ID:-}
      BILLPLZ_XSIGN_SECRET: ${BILLPLZ_XSIGN_SECRET:-}
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

# Self-hosted Supabase + GlitchTip + Uptime Kuma + Caddy reverse proxy are tracked
# in a separate task (B0.1 docker-compose + monitoring + backups). Hosted Supabase
# is used in dev while the full self-host stack is being built.
